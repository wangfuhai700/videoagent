[project]
name = "video-pipeline"
version = "0.1.0"
description = "Theme to final video: storyboard, concurrent video API, TTS, ffmpeg"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "edge-tts>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
